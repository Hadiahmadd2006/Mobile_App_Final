name: terrabite
description: "TerraBite — a recipe discovery app powered by TheMealDB."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  go_router: ^14.6.2
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4+4
  path: ^1.9.0
  path_provider: ^2.1.5
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.2
  share_plus: ^13.1.0
  google_fonts: ^8.1.0
  shared_preferences: ^2.5.5
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
